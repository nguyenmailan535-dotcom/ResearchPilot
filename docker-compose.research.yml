services:
  milvus-standalone:
    image: milvusdb/milvus:v2.6.4
    container_name: researchflow-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - researchflow-milvus:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "${RESEARCH_MILVUS_PORT:-19530}:19530"
      - "${RESEARCH_MILVUS_WEBUI_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  researchflow:
    image: researchflow-agent:local
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: researchflow
    restart: unless-stopped
    ports:
      - "${RESEARCHFLOW_PORT:-18791}:18791"
    volumes:
      - "${RESEARCHFLOW_WORKSPACE:-./workspace}:/data/workspace"
      - "${RESEARCHFLOW_PAPERS:-./papers}:/data/papers:ro"
      - "${NANOBOT_CONFIG_DIR:-~/.nanobot}:/root/.nanobot:ro"
      - "${RESEARCHFLOW_MODEL_CACHE:-./.cache/huggingface}:/root/.cache/huggingface"
    environment:
      RESEARCH_RETRIEVAL_BACKEND: milvus
      RESEARCH_MILVUS_URI: http://milvus-standalone:19530
      RESEARCH_MILVUS_COLLECTION: researchflow_chunks
      RESEARCH_EMBEDDING_MODEL: BAAI/bge-m3
      RESEARCH_BGE_DEVICE: ${RESEARCH_BGE_DEVICE:-cpu}
      RESEARCH_BGE_USE_FP16: ${RESEARCH_BGE_USE_FP16:-0}
      RESEARCH_EMBEDDING_BATCH_SIZE: ${RESEARCH_EMBEDDING_BATCH_SIZE:-16}
      RESEARCH_MILVUS_BATCH_SIZE: ${RESEARCH_MILVUS_BATCH_SIZE:-128}
      RESEARCH_RRF_BM25_WEIGHT: ${RESEARCH_RRF_BM25_WEIGHT:-1.0}
      RESEARCH_RRF_VECTOR_WEIGHT: ${RESEARCH_RRF_VECTOR_WEIGHT:-1.0}
      RESEARCH_RRF_RANK_CONSTANT: ${RESEARCH_RRF_RANK_CONSTANT:-20}
      RESEARCH_UNSTRUCTURED_STRATEGY: ${RESEARCH_UNSTRUCTURED_STRATEGY:-fast}
      HF_HOME: /root/.cache/huggingface
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      milvus-standalone:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${RESEARCHFLOW_CPUS:-6}"
          memory: 6G

  researchflow-eval:
    profiles: ["eval"]
    image: researchflow-ragas:local
    build:
      context: .
      dockerfile: Dockerfile.ragas
      args:
        RESEARCHFLOW_BASE_IMAGE: researchflow-agent:local
    volumes:
      - "${RESEARCHFLOW_WORKSPACE:-./workspace}:/data/workspace"
      - "${NANOBOT_CONFIG_DIR:-~/.nanobot}:/root/.nanobot:ro"
      - "${RESEARCHFLOW_MODEL_CACHE:-./.cache/huggingface}:/root/.cache/huggingface"
    environment:
      RESEARCH_EMBEDDING_MODEL: BAAI/bge-m3
      RESEARCH_BGE_DEVICE: ${RESEARCH_BGE_DEVICE:-cpu}
      HF_HOME: /root/.cache/huggingface
      RAGAS_MAX_TOKENS: ${RAGAS_MAX_TOKENS:-8192}
      RAGAS_REQUEST_TIMEOUT_SECONDS: ${RAGAS_REQUEST_TIMEOUT_SECONDS:-180}
      RAGAS_MAX_RETRIES: ${RAGAS_MAX_RETRIES:-1}
    entrypoint: ["nanobot", "research", "ragas-evaluate"]
    deploy:
      resources:
        limits:
          cpus: "${RESEARCHFLOW_CPUS:-6}"
          memory: 6G
volumes:
  researchflow-milvus:
