services:
  researchflow:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: researchflow
    restart: unless-stopped
    ports:
      - "${RESEARCHFLOW_PORT:-18791}:18791"
    volumes:
      - "${RESEARCHFLOW_WORKSPACE:-./workspace}:/data/workspace"
      - "${NANOBOT_CONFIG_DIR:-~/.nanobot}:/root/.nanobot:ro"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
