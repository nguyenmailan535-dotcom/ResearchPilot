name: ResearchFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: researchflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

    - name: Install all dependencies
      run: uv sync --all-extras

    - name: Lint
      run: >-
        uv run ruff check
        nanobot/api
        nanobot/research
        nanobot/agent/tools/research.py
        tests/api
        tests/research
        tests/tools/test_research_tools.py

    - name: Run ResearchFlow tests
      run: >-
        uv run pytest
        tests/api
        tests/research
        tests/tools/test_research_tools.py
        tests/test_openai_api.py

  research-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build ResearchFlow image
      run: docker build -f Dockerfile.research -t researchflow:test .
